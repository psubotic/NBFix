[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nbsynth"
version = "0.1.0"
description = "Static analysis framework for data science notebooks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "lark == 1.3.1",
    "azure-storage-blob",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
nbsynth = "nbsynth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nbsynth = ["parser/grammar/*.lark"]
