[build-system]
requires = ["hatchling>=1.21", "hatch-jupyter-builder>=0.8.2", "jupyterlab>=4.0,<5"]
build-backend = "hatchling.build"

[project]
name = "jupyterlab-nbsynth"
version = "0.1.0"
description = "JupyterLab labextension surfacing NBSynth notebook diagnostics live in the editor"
requires-python = ">=3.9"

[tool.hatch.build.targets.wheel]
packages = ["jupyterlab_nbsynth"]

[tool.hatch.build.targets.wheel.shared-data]
"install.json" = "share/jupyter/labextensions/nbsynth/install.json"
"jupyterlab_nbsynth/labextension" = "share/jupyter/labextensions/nbsynth"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.8.2"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyterlab_nbsynth/labextension/static/style.js",
    "jupyterlab_nbsynth/labextension/package.json",
]
skip-if-exists = ["jupyterlab_nbsynth/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["npm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["npm"]
source_dir = "src"
build_dir = "jupyterlab_nbsynth/labextension"
