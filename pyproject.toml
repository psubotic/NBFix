[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "nbsynth"
version = "0.1.0"
description = "Static analysis framework for data science notebooks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "lark == 1.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-jupyter[server]>=0.9",
]
# Registers the nbsynth REST API inside a running Jupyter server. This is
# deliberately just jupyter_server, not jupyterlab - the labextension that
# talks to this API is a separate package (jupyterlab-nbsynth/) so that
# installing it (and its jupyterlab/Node build-time cost) is opt-in and
# doesn't weigh down a plain `pip install nbsynth`.
jupyter = [
    "jupyter_server>=2.0,<3",
]
# LLM-assisted bug detection, grounded in NBSynth's own dependency/def-use
# analysis. Kept fully optional and separate from `dev`/`jupyter` - the
# base package and the JupyterLab extension must never gain an import-time
# dependency on an LLM client just because this feature exists.
llm = [
    "openai>=1.0",
]

[project.scripts]
nbsynth = "nbsynth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nbsynth"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter-config/jupyter_server_config.d" = "etc/jupyter/jupyter_server_config.d"
